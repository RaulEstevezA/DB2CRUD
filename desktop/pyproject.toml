[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "db2crud"
version = "0.1.0"
description = "Desktop tool that generates the repositories, services and missing ORM entities of an existing database, locally."
readme = "README_en.md"
license = "MIT"
authors = [{ name = "Raul Estevez" }]
requires-python = ">=3.11"
# PyYAML reads YAML inputs, as the yaml package does in the web version
dependencies = ["PySide6>=6.10", "PyYAML>=6.0"]

[project.optional-dependencies]
dev = ["pytest>=9.1", "ruff>=0.17"]
# Packaging the app; Pillow only regenerates the icons
build = ["pyinstaller>=6.22", "pillow>=11.0"]

[project.scripts]
db2crud = "db2crud.__main__:main"

[tool.setuptools.packages.find]
include = ["db2crud*"]

[tool.setuptools.package-data]
db2crud = ["assets/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"
# Copied from Model2DB by scripts/vendor-model2db.sh, never edited here
extend-exclude = ["db2crud/core/interop/model2db/vendor"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# Interface texts are kept whole, so each one reads as a sentence
"db2crud/ui/i18n.py" = ["E501"]

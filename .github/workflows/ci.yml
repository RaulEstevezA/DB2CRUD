# Checks the whole repository: types, lint, format, tests and build of the web version, and lint, format and
# tests of the desktop version (the window included, without opening it).
#
# Run by hand only (Actions → CI → Run workflow), as in Model2DB: every push to main already passes lint,
# tests and build of the web version in deploy-web.yml, and release-desktop.yml checks the desktop version
# again before every release. So each push starts a single workflow.

name: CI

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      # Includes the cases shared with the desktop version (shared/test-cases/)
      - run: npm test
      - run: npm run build

  desktop:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: desktop/pyproject.toml

      - name: Qt system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3

      - run: pip install ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      # The same cases of shared/test-cases/ as the web version, and the window without opening it
      - run: python -m pytest -q
        env:
          QT_QPA_PLATFORM: offscreen

# Checks the web version (types, lint, format, tests and build) and the desktop version (lint,
# format and tests, the window included, without opening it).
#
# Runs on every push to main and pull request that changes either version or the cases they
# share, and by hand (Actions → CI → Run workflow). release-desktop.yml checks the desktop
# version again before every release.

name: CI

on:
  push:
    branches: [main]
    paths:
      - 'web/**'
      - 'desktop/**'
      - 'shared/**'
      - '.github/workflows/ci.yml'
  pull_request:
    paths:
      - 'web/**'
      - 'desktop/**'
      - 'shared/**'
      - '.github/workflows/ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      # Includes the cases shared with the desktop version (shared/test-cases/)
      - run: npm test
      - run: npm run build

  desktop:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: desktop/pyproject.toml

      - name: Qt system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3

      - run: pip install ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      # The same cases of shared/test-cases/ as the web version, and the window without opening it
      - run: python -m pytest -q
        env:
          QT_QPA_PLATFORM: offscreen

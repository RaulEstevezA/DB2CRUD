# Builds the desktop version for Windows, macOS and Linux with PyInstaller.
# Windows and Linux have two builds each: x64 and ARM64.
#
# - Run by hand (Actions → Release desktop → Run workflow): builds every system and keeps
#   the files as workflow artifacts, without publishing anything.
# - Tag v* (git tag v0.1.0 && git push origin v0.1.0): also creates the GitHub release with
#   every file. The tag must match the version in desktop/pyproject.toml.
#
# File names carry no version, so
# https://github.com/RaulEstevezA/Model2API/releases/latest/download/<file>
# always points to the latest release (the web version's download button uses those URLs).
#
# The apps are not signed: macOS and Windows warn the first time they are opened.

name: Release desktop

on:
  push:
    tags: ['v*']
  workflow_dispatch:

env:
  PYTHON_VERSION: '3.12'

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            asset: Model2API-Windows.zip
          - os: windows-11-arm
            asset: Model2API-Windows-ARM64.zip
          # Apple Silicon. Intel Macs would need another build on an Intel runner.
          - os: macos-latest
            asset: Model2API-macOS.dmg
          # The oldest one available: the executable runs on systems with the same glibc as
          # the build system or a newer one.
          - os: ubuntu-22.04
            asset: Model2API-Linux.tar.gz
          # PySide6 for ARM64 is only published for glibc 2.39 or newer (Ubuntu 24.04)
          - os: ubuntu-24.04-arm
            asset: Model2API-Linux-ARM64.tar.gz
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
        working-directory: desktop

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: desktop/pyproject.toml

      - name: Check tag matches version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          version=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
          if [ "${GITHUB_REF_NAME}" != "v${version}" ]; then
            echo "::error::The tag ${GITHUB_REF_NAME} does not match the version in pyproject.toml (${version})."
            exit 1
          fi

      - name: Qt system libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3

      - name: Install dependencies
        run: pip install ".[dev,build]"

      - name: Lint
        run: ruff check .

      - name: Test
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest -q

      - name: Build
        run: pyinstaller --noconfirm packaging/model2api.spec

      - name: Smoke test
        timeout-minutes: 2
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          case "$RUNNER_OS" in
            Windows) dist/Model2API/Model2API.exe --smoke-test ;;
            macOS) dist/Model2API.app/Contents/MacOS/Model2API --smoke-test ;;
            Linux) dist/Model2API/Model2API --smoke-test ;;
          esac

      - name: Package
        run: |
          case "$RUNNER_OS" in
            Windows)
              pwsh -Command "Compress-Archive -Path dist/Model2API -DestinationPath '${{ matrix.asset }}'"
              ;;
            macOS)
              # Disk image with the app and a shortcut to Applications to drag it into
              mkdir dmg
              cp -R dist/Model2API.app dmg/
              ln -s /Applications dmg/Applications
              hdiutil create -volname Model2API -srcfolder dmg -format UDZO -ov "${{ matrix.asset }}"
              ;;
            Linux)
              tar -czf "${{ matrix.asset }}" -C dist Model2API
              ;;
          esac

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.asset }}
          path: desktop/${{ matrix.asset }}
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          path: assets
          merge-multiple: true

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" assets/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "Model2API $GITHUB_REF_NAME" \
            --generate-notes

# Checks every change: types, lint, format, tests and build of the web version, and lint, format and tests
# of the desktop version (the window included, without opening it). After a push to main passes, the web
# build is published at https://raulesteveza.github.io/tools/DB2CRUD/. It can also be run by hand.
#
# It runs only on pushes that change the app (web, desktop or what they share) or this workflow, and it
# publishes only when what makes the web changes: a change of the desktop version alone is checked, not
# published. One workflow per push, as in Mapper: there is no separate CI. release-desktop.yml checks the
# desktop version again before every release.
#
# Publishing needs a token that can write (Contents: Read and write) to RaulEstevezA.github.io, kept in this
# repository as the Actions secret PORTFOLIO_DEPLOY_TOKEN.

name: Deploy web

on:
  push:
    branches: [main]
    paths:
      - 'web/**'
      - 'shared/**'
      - 'desktop/**'
      - '.github/workflows/deploy-web.yml'
  pull_request:
  workflow_dispatch:

jobs:
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    outputs:
      publish: ${{ steps.changes.outputs.publish }}
    steps:
      - uses: actions/checkout@v7
        with:
          # The history, to compare with the commit before the push
          fetch-depth: 0

      # Published when the push changes the web, what is shared or this workflow, and always when run by
      # hand. When there is nothing to compare with (the first push of the branch), it is published.
      - name: Changes that reach the web
        id: changes
        working-directory: .
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          publish=true
          if [ "$GITHUB_EVENT_NAME" = "push" ] && git cat-file -e "${BEFORE}^{commit}" 2>/dev/null; then
            if ! git diff --name-only "$BEFORE" "$GITHUB_SHA" | grep -qE '^(web/|shared/|\.github/workflows/deploy-web\.yml)'; then
              publish=false
            fi
          fi
          echo "publish=${publish}" >> "$GITHUB_OUTPUT"
          echo "Publish: ${publish}"

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      # Includes the cases shared with the desktop version (shared/test-cases/)
      - run: npm test
      - run: npm run build

      - name: Upload web build
        uses: actions/upload-artifact@v7
        with:
          name: web-dist
          path: web/dist
          if-no-files-found: error
          # Only hands the build to the publishing job
          retention-days: 1

  deploy-web:
    if: github.event_name != 'pull_request' && needs.web.outputs.publish == 'true'
    needs: web
    runs-on: ubuntu-latest
    permissions:
      contents: read
    concurrency:
      group: deploy-web
      cancel-in-progress: false
    env:
      SITE_REPOSITORY: RaulEstevezA/RaulEstevezA.github.io
      TOOL_PATH: tools/DB2CRUD

    steps:
      - name: Check deploy token
        env:
          PORTFOLIO_DEPLOY_TOKEN: ${{ secrets.PORTFOLIO_DEPLOY_TOKEN }}
        run: |
          if [ -z "$PORTFOLIO_DEPLOY_TOKEN" ]; then
            echo "::error::The secret PORTFOLIO_DEPLOY_TOKEN is missing (Settings → Secrets and variables → Actions)."
            exit 1
          fi

      - name: Download web build
        uses: actions/download-artifact@v8
        with:
          name: web-dist
          path: web-dist

      - name: Checkout site
        uses: actions/checkout@v7
        with:
          repository: ${{ env.SITE_REPOSITORY }}
          ref: main
          token: ${{ secrets.PORTFOLIO_DEPLOY_TOKEN }}
          path: site

      - name: Copy build into site
        run: |
          mkdir -p "site/${TOOL_PATH}"
          rsync -a --delete web-dist/ "site/${TOOL_PATH}/"

      - name: Commit and push
        working-directory: site
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "${TOOL_PATH}"
          if git diff --cached --quiet; then
            echo "No changes in ${TOOL_PATH}"
            exit 0
          fi
          git commit -m "deploy: update ${TOOL_PATH} from ${GITHUB_REPOSITORY}@${GITHUB_SHA::7}"

          # Other projects publish in this repository too:
          # when the push fails because it is out of date, it is updated and tried again.
          for attempt in 1 2 3; do
            git pull --rebase origin main
            if git push origin HEAD:main; then
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              echo "Attempt $attempt failed; trying again after updating main."
              sleep 5
            fi
          done

          echo "Could not publish after 3 attempts."
          exit 1

  desktop:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: desktop/pyproject.toml

      - name: Qt system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3

      - run: pip install ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      # The same cases of shared/test-cases/ as the web version, and the window without opening it
      - run: python -m pytest -q
        env:
          QT_QPA_PLATFORM: offscreen

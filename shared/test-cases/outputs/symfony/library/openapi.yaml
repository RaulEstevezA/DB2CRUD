components:
  schemas:
    Genre:
      type: string
      enum:
        - novel
        - essay
        - poetry
        - science
    Author:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          minLength: 2
          maxLength: 120
        email:
          type:
            - string
            - "null"
          format: email
          default: null
        born:
          type:
            - string
            - "null"
          format: date
          default: null
      required:
        - id
        - name
        - email
        - born
    AuthorCreate:
      type: object
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 120
        email:
          type:
            - string
            - "null"
          format: email
          default: null
        born:
          type:
            - string
            - "null"
          format: date
          default: null
      required:
        - name
      additionalProperties: false
    AuthorUpdate:
      type: object
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 120
        email:
          type:
            - string
            - "null"
          format: email
          default: null
        born:
          type:
            - string
            - "null"
          format: date
          default: null
      additionalProperties: false
    AuthorPage:
      type: object
      required:
        - items
        - total
        - page
        - size
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Author"
        total:
          type: integer
          minimum: 0
        page:
          type: integer
          minimum: 1
        size:
          type: integer
          minimum: 1
          maximum: 100
    Book:
      type: object
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
          minLength: 1
          maxLength: 200
        isbn:
          type: string
          pattern: ^[0-9]{13}$
        authorId:
          type: string
          format: uuid
        genre:
          $ref: "#/components/schemas/Genre"
        pages:
          type: integer
          minimum: 1
          maximum: 5000
        published:
          type:
            - string
            - "null"
          format: date
          default: null
        available:
          type: boolean
          default: true
      required:
        - id
        - title
        - isbn
        - authorId
        - genre
        - pages
        - published
        - available
    BookCreate:
      type: object
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 200
        isbn:
          type: string
          pattern: ^[0-9]{13}$
        authorId:
          type: string
          format: uuid
        genre:
          $ref: "#/components/schemas/Genre"
        pages:
          type: integer
          minimum: 1
          maximum: 5000
        published:
          type:
            - string
            - "null"
          format: date
          default: null
        available:
          type: boolean
          default: true
      required:
        - title
        - isbn
        - authorId
        - genre
        - pages
      additionalProperties: false
    BookUpdate:
      type: object
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 200
        isbn:
          type: string
          pattern: ^[0-9]{13}$
        authorId:
          type: string
          format: uuid
        genre:
          $ref: "#/components/schemas/Genre"
        pages:
          type: integer
          minimum: 1
          maximum: 5000
        published:
          type:
            - string
            - "null"
          format: date
          default: null
        available:
          type: boolean
          default: true
      additionalProperties: false
    BookPage:
      type: object
      required:
        - items
        - total
        - page
        - size
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Book"
        total:
          type: integer
          minimum: 0
        page:
          type: integer
          minimum: 1
        size:
          type: integer
          minimum: 1
          maximum: 100
    Error:
      type: object
      required:
        - error
      properties:
        error:
          type: object
          required:
            - code
            - message
          properties:
            code:
              type: string
              enum:
                - validation_error
                - unauthorized
                - forbidden
                - not_found
                - conflict
                - not_implemented
                - method_not_allowed
                - internal_error
            message:
              type: string
            details:
              type: array
              items:
                type: object
                required:
                  - field
                  - message
                properties:
                  field:
                    type: string
                  message:
                    type: string

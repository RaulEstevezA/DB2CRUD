# Services of the API: every class of src/ is a service, wired by its constructor.
parameters:

services:
    _defaults:
        autowire: true
        autoconfigure: true

    App\:
        resource: '../src/'
        exclude: '../src/Kernel.php'

    # Data kept in memory while the application runs; restarting it (or each test) starts empty
    App\Repository\AuthorRepository: '@App\Repository\InMemoryAuthorRepository'
    App\Repository\BookRepository: '@App\Repository\InMemoryBookRepository'

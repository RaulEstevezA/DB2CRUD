components:
  schemas:
    Category:
      type: object
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
          minLength: 1
          maxLength: 80
        parentId:
          type:
            - integer
            - "null"
          format: int64
      required:
        - id
        - name
      description: "Catalogue: JPA entities with Bean Validation"
    CategoryCreate:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 80
        parentId:
          type:
            - integer
            - "null"
          format: int64
      required:
        - name
      additionalProperties: false
    CategoryUpdate:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 80
        parentId:
          type:
            - integer
            - "null"
          format: int64
      additionalProperties: false
    CategoryPage:
      type: object
      required:
        - items
        - total
        - page
        - size
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Category"
        total:
          type: integer
          minimum: 0
        page:
          type: integer
          minimum: 1
        size:
          type: integer
          minimum: 1
          maximum: 100
    Item:
      type: object
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
          minLength: 3
          maxLength: 120
        price:
          type: number
          format: decimal
          minimum: 0
        supplierEmail:
          type: string
          format: email
        categoryId:
          type: integer
          format: int64
        stock:
          type: integer
          format: int32
          minimum: 0
      required:
        - id
        - name
        - price
        - supplierEmail
        - categoryId
        - stock
    ItemCreate:
      type: object
      properties:
        name:
          type: string
          minLength: 3
          maxLength: 120
        price:
          type: number
          format: decimal
          minimum: 0
        supplierEmail:
          type: string
          format: email
        categoryId:
          type: integer
          format: int64
        stock:
          type: integer
          format: int32
          minimum: 0
      required:
        - name
        - price
        - supplierEmail
        - categoryId
        - stock
      additionalProperties: false
    ItemUpdate:
      type: object
      properties:
        name:
          type: string
          minLength: 3
          maxLength: 120
        price:
          type: number
          format: decimal
          minimum: 0
        supplierEmail:
          type: string
          format: email
        categoryId:
          type: integer
          format: int64
        stock:
          type: integer
          format: int32
          minimum: 0
      additionalProperties: false
    ItemPage:
      type: object
      required:
        - items
        - total
        - page
        - size
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Item"
        total:
          type: integer
          minimum: 0
        page:
          type: integer
          minimum: 1
        size:
          type: integer
          minimum: 1
          maximum: 100
    Error:
      type: object
      required:
        - error
      properties:
        error:
          type: object
          required:
            - code
            - message
          properties:
            code:
              type: string
              enum:
                - validation_error
                - unauthorized
                - forbidden
                - not_found
                - conflict
                - not_implemented
                - method_not_allowed
                - internal_error
            message:
              type: string
            details:
              type: array
              items:
                type: object
                required:
                  - field
                  - message
                properties:
                  field:
                    type: string
                  message:
                    type: string

components:
  schemas:
    OrderStatus:
      type: string
      enum:
        - pending
        - paid
        - shipped
        - cancelled
    Address:
      type: object
      properties:
        street:
          type: string
        city:
          type: string
        postalCode:
          type: string
        country:
          type: string
      required:
        - street
        - city
        - postalCode
        - country
      additionalProperties: false
    OrderLine:
      type: object
      properties:
        productId:
          type: integer
        quantity:
          type: number
        unitPrice:
          type: number
      required:
        - productId
        - quantity
        - unitPrice
      additionalProperties: false
    Customer:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        email:
          type: string
        phone:
          type:
            - string
            - "null"
        address:
          $ref: "#/components/schemas/Address"
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - name
        - email
        - address
        - createdAt
    CustomerCreate:
      type: object
      properties:
        name:
          type: string
        email:
          type: string
        password:
          type: string
        phone:
          type: string
        address:
          $ref: "#/components/schemas/Address"
      required:
        - name
        - email
        - password
        - address
      additionalProperties: false
    CustomerUpdate:
      type: object
      properties:
        name:
          type: string
        email:
          type: string
        password:
          type: string
        phone:
          type: string
        address:
          $ref: "#/components/schemas/Address"
      additionalProperties: false
    CustomerPage:
      type: object
      required:
        - items
        - total
        - page
        - size
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Customer"
        total:
          type: integer
          minimum: 0
        page:
          type: integer
          minimum: 1
        size:
          type: integer
          minimum: 1
          maximum: 100
    Product:
      type: object
      properties:
        id:
          type: integer
        sku:
          type: string
        name:
          type: string
        description:
          type:
            - string
            - "null"
        price:
          type: number
        stock:
          type: number
        active:
          type: boolean
      required:
        - id
        - sku
        - name
        - price
        - stock
        - active
    ProductCreate:
      type: object
      properties:
        sku:
          type: string
        name:
          type: string
        description:
          type: string
        price:
          type: number
        stock:
          type: number
        active:
          type: boolean
      required:
        - sku
        - name
        - price
        - stock
        - active
      additionalProperties: false
    ProductUpdate:
      type: object
      properties:
        sku:
          type: string
        name:
          type: string
        description:
          type: string
        price:
          type: number
        stock:
          type: number
        active:
          type: boolean
      additionalProperties: false
    ProductPage:
      type: object
      required:
        - items
        - total
        - page
        - size
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Product"
        total:
          type: integer
          minimum: 0
        page:
          type: integer
          minimum: 1
        size:
          type: integer
          minimum: 1
          maximum: 100
    Order:
      type: object
      properties:
        id:
          type: integer
        customerId:
          type: integer
        lines:
          type: array
          items:
            $ref: "#/components/schemas/OrderLine"
        status:
          $ref: "#/components/schemas/OrderStatus"
        total:
          type: number
        notes:
          type:
            - string
            - "null"
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required:
        - id
        - customerId
        - lines
        - status
        - total
        - createdAt
        - updatedAt
    OrderCreate:
      type: object
      properties:
        customerId:
          type: integer
        lines:
          type: array
          items:
            $ref: "#/components/schemas/OrderLine"
        status:
          $ref: "#/components/schemas/OrderStatus"
        total:
          type: number
        notes:
          type:
            - string
            - "null"
      required:
        - customerId
        - lines
        - status
        - total
      additionalProperties: false
    OrderUpdate:
      type: object
      properties:
        customerId:
          type: integer
        lines:
          type: array
          items:
            $ref: "#/components/schemas/OrderLine"
        status:
          $ref: "#/components/schemas/OrderStatus"
        total:
          type: number
        notes:
          type:
            - string
            - "null"
      additionalProperties: false
    OrderPage:
      type: object
      required:
        - items
        - total
        - page
        - size
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Order"
        total:
          type: integer
          minimum: 0
        page:
          type: integer
          minimum: 1
        size:
          type: integer
          minimum: 1
          maximum: 100
    Error:
      type: object
      required:
        - error
      properties:
        error:
          type: object
          required:
            - code
            - message
          properties:
            code:
              type: string
              enum:
                - validation_error
                - unauthorized
                - forbidden
                - not_found
                - conflict
                - not_implemented
                - method_not_allowed
                - internal_error
            message:
              type: string
            details:
              type: array
              items:
                type: object
                required:
                  - field
                  - message
                properties:
                  field:
                    type: string
                  message:
                    type: string
